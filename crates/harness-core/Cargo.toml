[package]
name = "harness-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harnessd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
