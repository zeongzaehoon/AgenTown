[package]
name = "agentown-desktop"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
default = ["shell"]
shell = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
fs2 = "0.4"
rand = "0.9"
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[[bin]]
name = "agentown-desktop"
path = "src/main.rs"
required-features = ["shell"]
